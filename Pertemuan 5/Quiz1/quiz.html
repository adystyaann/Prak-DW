<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jelajah Lokal</title>
  <link rel="stylesheet" href="quiz.css">
</head>

<header class="header">
  <a>Jelajah<span>Lokal</span></a>
</header>

<body>
  <main class="login-card">
    <h1>Selamat Datang</h1>
    <p class="intro">Masuk untuk mulai menjelajahi tempat menarik<br class="desktop-break"> di sekitar kita.</p>

    <form action="#" method="post">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="nama@email.com" autocomplete="email" required>
      </div>

      <div class="form-group password-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Masukkan password" autocomplete="current-password" required>
      </div>

      <label class="remember">
        <input type="checkbox" name="remember">
        <span>Ingat saya</span>
      </label>

      <button type="submit">Login</button>
    </form>

    <p class="guest-text">
        Belum ingin login? 
        <a href="quiz1.html">
            Jelajahi sebagai tamu
        </a>
    </p>
  </main>
</body>
</html>
