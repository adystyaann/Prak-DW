<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Belajar Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>Produk Kami</h1>

        <div class="produk">
            <h3>Headphone</h3>
            <p>Harga: Rp250.000</p>

            <button id="beli">Beli Sekarang</button>
        </div>
    </main>

    <!-- Modal -->
    <div id="modal" class="modal">

        <div class="modal-content">

            <h2>Pembelian Berhasil!</h2>

            <p>Terima kasih telah melakukan pembelian.</p>

            <button id="tutup">Tutup</button>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
